server.port=8080
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# gzip for clients that accept it (JSON is in the default MIME list, 2 KB minimum): the full sample
# list of a 30 MB MoTeC export shrinks from about 28 MB to under 1 MB.
server.compression.enabled=true
# Samples kept in memory over all stored sessions; the oldest sessions are evicted beyond it.
# 600,000 samples (five 30 MB MoTeC exports, about 75 MB of heap) leave room under -Xmx256m
# for parsing the next upload. 0 = unbounded.
telemetry.store.max-samples=600000
